[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["spiral_net", "spirals_scene", "make_previews"]

[project]
name = "neural-spirals"
version = "1.0.0"
description = "An animation of a small neural network learning to separate two spirals, trained live in numpy and rendered with ManimGX."
requires-python = ">=3.13"
dependencies = ["manimgx>=0.1.1", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
